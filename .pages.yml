        fields:
          - { name: id, component: id }
          - { name: title, component: title }
          - { name: description, component: description }
          - { name: date, component: date }
          - { name: kind, component: kind }
          - { name: draft, component: draft }
          - { name: image, component: image }
          - { name: image_alt, component: image_alt }
          - { name: body, component: body }
      - name: blog-cs
        label: Čeština
        type: collection
        path: src/content/blog/cs
