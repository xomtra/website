<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: graphite single-column bands; hero = pitch + console-style answer panel over faint crossing-series line art; data and commands in mono */
:root{
  --bg:#0b0c0f; --surface:#121419; --raise:#181b21; --line:#252932; --ink:#eceef3; --muted:#959cab;
  --accent:#7d8bff; --accent-ink:#0b0c0f; --signal:#ffb547; --ok:#5fd4a0;
  --sans:"Geist","Segoe UI",system-ui,sans-serif; --mono:"Geist Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:20px;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand svg{width:30px;height:30px;flex:none}
.brand span{font:600 21px/1 var(--sans);letter-spacing:-.045em}
nav.sec{display:flex;gap:18px;margin-left:auto}
nav.sec a{color:var(--muted);text-decoration:none;font-size:14px}
nav.sec a:hover{color:var(--ink)}
nav.lang{display:flex;gap:2px;border:1px solid var(--line);border-radius:8px;padding:2px}
nav.lang a{font:500 12px/1 var(--mono);color:var(--muted);text-decoration:none;padding:6px 8px;border-radius:6px;letter-spacing:.06em}
nav.lang a[aria-current="true"]{background:var(--raise);color:var(--ink)}
a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.hero .art{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hero .art path{fill:none;stroke-width:1.4;stroke-linecap:round}
.hero .wrap{position:relative;display:grid;grid-template-columns:1.05fr .95fr;gap:56px;padding-block:72px 64px;align-items:center}
.hero .wrap>*{min-width:0}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font:500 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:7px 11px}
.eyebrow i{width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 22%,transparent)}
h1{font:600 clamp(36px,5.4vw,60px)/1.02 var(--sans);letter-spacing:-.045em;margin:20px 0 20px;text-wrap:balance}
.lead{font-size:18px;color:var(--muted);max-width:33em;margin:0 0 28px}
.ctas{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;font:500 15px/1 var(--sans);padding:13px 18px;border-radius:9px;text-decoration:none;border:1px solid var(--line);color:var(--ink);background:var(--surface)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.note{font:400 12.5px/1.5 var(--mono);color:var(--muted);margin-top:18px;letter-spacing:.01em}

.console{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 30px 60px -30px rgba(0,0,0,.8)}
.console .bar{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);font:500 12px/1 var(--mono);color:var(--muted)}
.console .bar b{width:9px;height:9px;border-radius:50%;background:var(--line)}
.console .bar em{margin-left:auto;font-style:normal;color:var(--ok)}
.console .body{padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{border-radius:10px;padding:12px 14px;font-size:15px}
.msg.q{background:var(--raise);align-self:flex-end;max-width:88%}
.msg.a{border:1px solid var(--line)}
.who{display:block;font:500 11px/1 var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:7px}
.data{font-family:var(--mono);font-size:13.5px;color:var(--signal);font-variant-numeric:tabular-nums}
.spark{width:100%;height:64px;margin-top:10px;display:block}
.legend{display:flex;gap:14px;font:400 11px/1 var(--mono);color:var(--muted);margin-top:6px}
.legend span::before{content:"";display:inline-block;width:12px;height:2px;vertical-align:middle;margin-right:6px;background:var(--c)}

section{padding-block:72px;border-bottom:1px solid var(--line)}
.kick{font:500 12px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin:0 0 14px}
h2{font:600 clamp(28px,3.6vw,40px)/1.08 var(--sans);letter-spacing:-.035em;margin:0 0 12px;text-wrap:balance}
.sub{color:var(--muted);max-width:40em;margin:0 0 36px}

.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line);border-radius:14px;overflow:hidden}
.step{padding:26px 24px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.step+.step{border-left:1px solid var(--line)}
.step .n{font:500 13px/1 var(--mono);color:var(--accent);display:flex;align-items:center;gap:10px}
.step .n::after{content:"";flex:1;height:1px;background:var(--line)}
.step h3{font:600 20px/1.2 var(--sans);letter-spacing:-.02em;margin:0}
.step p{margin:0;color:var(--muted);font-size:15px}

.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:36px}
.feat{border-top:1px solid var(--line);padding-top:20px}
.feat .k{font:500 12px/1 var(--mono);color:var(--signal);display:block;margin-bottom:12px;letter-spacing:.04em}
.feat h3{font:600 18px/1.3 var(--sans);letter-spacing:-.015em;margin:0 0 8px}
.feat p{margin:0;color:var(--muted);font-size:15px}

.qs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;list-style:none;padding:0;margin:0}
.qs li{border:1px solid var(--line);border-radius:10px;padding:14px 16px 14px 40px;font-size:15px;position:relative;background:var(--surface)}
.qs li::before{content:"›";position:absolute;left:16px;top:12px;font:500 17px/1.2 var(--mono);color:var(--accent)}

.install{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.inst{border:1px solid var(--line);border-radius:12px;padding:20px;background:var(--surface);display:flex;flex-direction:column;gap:8px;min-width:0}
.inst h3{font:600 16px/1.3 var(--sans);margin:0}
.inst p{margin:0;font-size:14px;color:var(--muted);flex:1}
.inst code{font:400 12px/1.5 var(--mono);color:var(--ink);background:var(--bg);border:1px solid var(--line);padding:8px 10px;border-radius:7px;overflow-x:auto;display:block;white-space:nowrap;margin-top:6px}
.inst code::before{content:"$ ";color:var(--muted)}

.cmp{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:15px}
th,td{text-align:left;padding:13px 16px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
th{font:500 11.5px/1.3 var(--mono);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);background:var(--surface)}
th:last-child{color:var(--accent)}
td.n{color:var(--muted)} td.y{color:var(--ink);font-weight:500}

.faq{max-width:760px}
details{border-bottom:1px solid var(--line);padding-block:16px}
summary{cursor:pointer;font-weight:500;list-style:none;display:flex;justify-content:space-between;gap:16px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font:400 18px/1 var(--mono);color:var(--muted)}
details[open] summary::after{content:"−"}
details p{color:var(--muted);margin:10px 0 0;max-width:46em}

footer .wrap{display:flex;gap:16px 28px;flex-wrap:wrap;align-items:center;padding-block:32px;color:var(--muted);font-size:13px}
footer .brand span{font-size:17px}
footer .brand svg{width:24px;height:24px}
footer p{margin:0;flex:1;min-width:240px}

@media (prefers-reduced-motion:no-preference){
  .hero .art path{stroke-dasharray:1600;animation:draw 2.4s ease-out both}
  .hero .art path+path{animation-delay:.25s}
  @keyframes draw{from{stroke-dashoffset:1600}to{stroke-dashoffset:0}}
}
@media (max-width:900px){
  .hero .wrap{grid-template-columns:1fr;gap:40px;padding-block:48px}
  .grid,.steps{grid-template-columns:1fr}
  .step+.step{border-left:0;border-top:1px solid var(--line)}
  .install{grid-template-columns:repeat(2,minmax(0,1fr))}
  .qs{grid-template-columns:1fr}
  nav.sec{display:none}
  nav.lang{margin-left:auto}
}
@media (max-width:520px){.install{grid-template-columns:1fr} section{padding-block:52px}}
</style>

function pick(){

}
